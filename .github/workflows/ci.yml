name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Wrangler is only used here to generate binding types. Keep it quiet and
      # stop it phoning home from CI.
      WRANGLER_SEND_METRICS: false
      CI: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # worker-configuration.d.ts is generated, not committed, and tsconfig
      # references it — so this has to run before anything type-aware.
      - name: Generate binding types
        run: npm run typegen

      # Ordered cheapest-first, so an obvious failure does not wait behind a
      # build. Each step still runs even if an earlier one failed, because
      # seeing every problem at once beats fixing them one push at a time.
      - name: Format
        if: ${{ !cancelled() }}
        run: npx prettier --check .

      - name: Types
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Tests
        if: ${{ !cancelled() }}
        run: npm run test:coverage

      # `vite build` rather than `npm run build`, which would re-run typegen
      # and a second `tsc --noEmit` that the Types step already did. Together
      # the steps above cover exactly what `npm run build` does.
      - name: Build
        if: ${{ !cancelled() }}
        run: npx vite build

      # Catches config problems that only surface at deploy time — a bad
      # binding, a broken migration — without needing credentials.
      - name: Deploy dry run
        if: ${{ !cancelled() }}
        run: npx wrangler deploy --dry-run

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
