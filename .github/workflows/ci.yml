name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless. Safe for
# the deploy job too: the newer run cancels the older one, so the newest
# commit is always the one that ships.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, now that this workflow carries a deployment credential.
# Nothing here writes to the repository; artifact upload uses the runner's
# own token rather than this one.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Wrangler is only used here to generate binding types. Keep it quiet and
      # stop it phoning home from CI.
      WRANGLER_SEND_METRICS: false
      CI: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # worker-configuration.d.ts is generated, not committed, and tsconfig
      # references it — so this has to run before anything type-aware.
      - name: Generate binding types
        run: npm run typegen

      # Ordered cheapest-first, so an obvious failure does not wait behind a
      # build. Each step still runs even if an earlier one failed, because
      # seeing every problem at once beats fixing them one push at a time.
      - name: Format
        if: ${{ !cancelled() }}
        run: npx prettier --check .

      - name: Lint
        if: ${{ !cancelled() }}
        run: npx eslint . --max-warnings 0

      - name: Types
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Tests
        if: ${{ !cancelled() }}
        run: npm run test:coverage

      # `vite build` rather than `npm run build`, which would re-run typegen
      # and a second `tsc --noEmit` that the Types step already did. Together
      # the steps above cover exactly what `npm run build` does.
      - name: Build
        if: ${{ !cancelled() }}
        run: npx vite build

      # Catches config problems that only surface at deploy time — a bad
      # binding, a broken migration — without needing credentials.
      - name: Deploy dry run
        if: ${{ !cancelled() }}
        run: npx wrangler deploy --dry-run

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Deploy
    # `needs` is what gates this: a failed or cancelled Verify never reaches
    # here. Note the steps above deliberately run past a failure so every
    # problem shows at once — that makes the job red, which is what counts.
    needs: verify
    # `on.push.branches` already limits pushes to main. The ref is checked
    # anyway so that adding a branch there later cannot start deploying it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Gives GitHub a deployment record and a link, and leaves somewhere to
    # attach a required reviewer later without touching this file.
    environment:
      name: production
      url: https://hubbub.franciscaportugal2005.workers.dev

    env:
      WRANGLER_SEND_METRICS: false
      CI: true
      # The account id is not secret — it is committed in wrangler.jsonc — so
      # the token is the only credential this needs.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      # `secrets` is not a context an `if` can read, hence the env mapping
      # above. Worth the four lines: without it a missing secret fails deep
      # inside wrangler with an auth error that never mentions the secret.
      - name: Check credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Rebuilt rather than carried from Verify as an artifact: wrangler needs
      # node_modules here regardless, and the build takes under a second. No
      # typegen either — it only emits types for tsc, which already ran, and
      # neither the build nor the deploy reads them.
      - name: Build
        run: npx vite build

      # The same wrangler and the same command as the dry run, minus the flag.
      # Deliberately not cloudflare/wrangler-action: this uses the version
      # pinned in package.json, so whatever passed the dry run is what ships.
      - name: Deploy
        run: npx wrangler deploy
